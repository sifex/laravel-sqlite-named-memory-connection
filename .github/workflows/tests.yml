name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Laravel 5.5 - 5.8
          - laravel: '5.5.*'
            php: '7.2'
            phpunit: '^7.0'
          - laravel: '5.8.*'
            php: '7.4'
            phpunit: '^8.0'

          # Laravel 6
          - laravel: '6.*'
            php: '7.4'
            phpunit: '^8.0'

          # Laravel 7
          - laravel: '7.*'
            php: '7.4'
            phpunit: '^9.0'

          # Laravel 8
          - laravel: '8.*'
            php: '8.0'
            phpunit: '^9.0'

          # Laravel 9
          - laravel: '9.*'
            php: '8.1'
            phpunit: '^9.0'

          # Laravel 10
          - laravel: '10.*'
            php: '8.2'
            phpunit: '^10.0'

          # Laravel 11
          - laravel: '11.*'
            php: '8.3'
            phpunit: '^10.0'

          # Laravel 12
          - laravel: '12.*'
            php: '8.3'
            phpunit: '^11.0'

    name: Laravel ${{ matrix.laravel }} - PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, sqlite, mbstring
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}-laravel-${{ matrix.laravel }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/database:${{ matrix.laravel }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit --testdox
